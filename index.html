	<script type="text/javascript" >
			function showValue()
			{
				alert(window.say_yes);// c++提供的值（bind到浏览器window下）
			}
			function showAlert()
			{
				alert("this is test string from js");
			}
			function add()
			{
				// add 函数名不能与window对象挂接addFunction相同
				try{
					var result = window.jsSendJsonStrToQt("aaaa");// C++提供的接口，bind到window对象上
					//alert("10 + 20 = " + result);
				}catch(err){
					alert("error message is: " + err.message);
				}
			}
			function add2(values)
			{
				alert(values);
			}
	</script>
</head>
<body>
	
    <div>
        <button id="btnReadTextFile">读取文本文件</button>
		<button onclick="showValue();">js获取qt的值</button>
<button onclick="add();">1.js传参给qt</button>
